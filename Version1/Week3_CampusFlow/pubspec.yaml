name: campus_flow
description: Professional Student Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  qr_flutter: ^4.1.0  # for QR codes
  mobile_scanner: ^7.2.0  # for scanning QR codes
  geolocator: ^14.0.2  # for location
  permission_handler: ^12.0.3
  package_info_plus: ^10.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true